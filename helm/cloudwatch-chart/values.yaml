# Global settings
namespace: monitoring

# App settings
app:
  name: cloudwatch-app
  image:
    repository: eljinaguilar/cloudwatch-app
    tag: latest
    pullPolicy: Always
  replicas: 2
  port: 3001
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  config:
    nodeEnv: "production"
    logLevel: "info"

# Prometheus settings
prometheus:
  name: prometheus
  image:
    repository: prom/prometheus
    tag: latest
  replicas: 1
  port: 9090
  retention: "7d"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"

# Grafana settings
grafana:
  name: grafana
  image:
    repository: grafana/grafana
    tag: latest
  replicas: 1
  port: 3000
  adminUser: admin
  adminPassword: cloudwatch123
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Ingress settings
ingress:
  enabled: true
  className: nginx
  host: ""
