apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:{{ .Values.prometheus.port }}"]

      - job_name: "cloudwatch-app"
        static_configs:
          - targets: ["{{ .Values.app.name }}-service.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.app.port }}"]
            labels:
              group: "application"
        metrics_path: /metrics
