apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Values.prometheus.name }}-service.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.prometheus.port }}
        isDefault: true
        editable: true
