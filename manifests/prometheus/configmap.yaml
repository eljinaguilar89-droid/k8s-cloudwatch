
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  # The key name becomes the filename when mounted as a volume
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "cloudwatch-app"
        static_configs:
          # In Kubernetes, services are reachable by their name
          # Format: SERVICE_NAME.NAMESPACE.svc.cluster.local
          - targets: ["cloudwatch-app-service.monitoring.svc.cluster.local:3001"]
            labels:
              group: "application"